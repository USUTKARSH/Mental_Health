spring.application.name=mindcare
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mental_health}
spring.data.mongodb.database=${MONGO_DB:mental_health}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3002,http://localhost:5173}
spring.jackson.serialization.write-dates-as-timestamps=false